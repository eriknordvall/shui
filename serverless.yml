# Your own Serverless org, read from config.yml (not committed - copy config.example.yml).
org: ${file(./config.yml):org}
# Used in the names of the Lambdas and the stack in AWS.
service: shui

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role: ${file(./config.yml):role}

functions:
  health:
    handler: functions/health/index.handler
    events:
      - httpApi:
          path: /health
          method: GET

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: shui-users
        AttributeDefinitions:
          - AttributeName: username
            AttributeType: S
        KeySchema:
          - AttributeName: username
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    
    CommentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: shui-comments
        AttributeDefinitions:
          - AttributeName: postId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: postId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        